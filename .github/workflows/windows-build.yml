name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: ['mejoras-escritorio']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/run_tests.py
        env:
          PYTHONUTF8: '1'
      - run: python -m PyInstaller --noconfirm RegistroDocente.spec
      - name: Verify real executable and legacy migration
        run: python tools/smoke_windows.py dist/RegistroDocente/RegistroDocente.exe
      - name: Verify owner and include teacher guide
        shell: pwsh
        run: |
          $info = (Get-Item dist/RegistroDocente/RegistroDocente.exe).VersionInfo
          if ($info.CompanyName -ne 'Leonardo Roque' -or $info.ProductVersion -ne '1.5.0') { throw 'Propietario o versión incorrectos.' }
          Copy-Item docs/GUIA-USO.txt dist/RegistroDocente/GUIA-USO.txt
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss'
      - name: Build separate seller tool
        run: python -m PyInstaller --noconfirm RegistroLicencias.spec
      - name: Verify seller executable
        run: python tools/smoke_windows.py --seller dist/RegistroLicencias/RegistroLicencias.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RegistroDocente-Windows
          path: |
            dist/installer/*.exe
            dist/RegistroDocente/**
      - uses: actions/upload-artifact@v4
        with:
          name: RegistroLicencias-SoloVendedor
          path: |
            dist/RegistroLicencias/**
            docs/LEEME-VENDEDOR.txt
