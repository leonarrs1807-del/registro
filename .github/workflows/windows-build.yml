name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: ['mejoras-escritorio']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/run_tests.py
      - run: python -m PyInstaller --noconfirm RegistroDocente.spec
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: RegistroDocente-Windows
          path: |
            dist/installer/*.exe
            dist/RegistroDocente/**
