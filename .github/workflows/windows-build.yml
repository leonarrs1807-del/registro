name: Compilar Registro Docente - Windows
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edición del instalador
        type: choice
        options: [comercial, personal]
        default: comercial
      review:
        description: Compilación de revisión para el propietario
        type: boolean
        default: false
  workflow_call:
    inputs:
      edition:
        type: string
        default: comercial
      review:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      REGISTRO_EDITION: ${{ inputs.edition || 'comercial' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Verify commercial public key
        if: env.REGISTRO_EDITION == 'comercial'
        run: python tools/verificar_comercial.py
      - run: python tools/run_tests.py
        env:
          PYTHONUTF8: '1'
      - run: python -m PyInstaller --noconfirm RegistroDocente.spec
      - name: Verify real executable and legacy migration
        run: python tools/smoke_windows.py dist/RegistroDocente/RegistroDocente.exe ${{ inputs.edition == 'comercial' && '--commercial' || '' }}
      - name: Verify owner and include teacher guide
        shell: pwsh
        run: |
          $info = (Get-Item dist/RegistroDocente/RegistroDocente.exe).VersionInfo
          if ($info.CompanyName -ne 'Leonardo Roque' -or $info.ProductVersion -ne '2.1.0') { throw 'Propietario o versión incorrectos.' }
          Copy-Item docs/GUIA-USO.txt dist/RegistroDocente/GUIA-USO.txt
      - name: Identify owner review package
        if: inputs.review
        shell: pwsh
        run: Copy-Item docs/LEEME-REVISION.txt dist/RegistroDocente/LEEME-REVISION.txt
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss'
      - name: Build separate seller tool
        if: ${{ !inputs.review }}
        run: python -m PyInstaller --noconfirm RegistroLicencias.spec
      - name: Verify seller executable
        if: ${{ !inputs.review }}
        run: python tools/smoke_windows.py --seller dist/RegistroLicencias/RegistroLicencias.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.review && 'RegistroDocente-Full-2.1-Windows' || inputs.edition == 'comercial' && 'RegistroDocente-Comercial-Windows' || 'RegistroDocente-Windows' }}
          path: |
            dist/installer/*.exe
            dist/RegistroDocente/**
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.review }}
        with:
          name: RegistroLicencias-SoloVendedor
          path: |
            dist/RegistroLicencias/**
            docs/LEEME-VENDEDOR.txt
