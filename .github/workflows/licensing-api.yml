name: Verificar API de licencias
on:
  push:
    branches: ['mejoras-escritorio']
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r license_api/requirements.txt
      - run: python -m unittest -v tests.test_license_api
